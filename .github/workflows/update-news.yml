name: Update news and advisories

on:
  schedule:
    - cron: "17 18 * * *"        # every evening: refresh, then PREPARE tomorrow's email (Brevo delivers it at 08:30 IST)
    - cron: "17 3,9,15 * * *"    # three more refreshes during the day (no email)
  workflow_dispatch:              # run it by hand from the Actions tab
    inputs:
      send_digest:
        description: "Also send the email digest to subscribers"
        type: boolean
        default: false

permissions:
  contents: write                 # lets the job commit the refreshed page

# One run at a time, so two runs can never push over each other.
concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ONE script does everything: news cards + travel advisories.
      # If your page isn't called index.html, change the filename in the two python steps.
      - name: Refresh news cards and travel advisories
        run: python scripts/update_news.py index.html

      - name: Commit and push if changed
        if: ${{ !cancelled() }}
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name  "umrahnow-news-bot"
          git config user.email "umrahnow-news-bot@users.noreply.github.com"
          git add -A
          git commit -m "chore: refresh Umrah/Hajj news and travel advisories [automated]"
          # Pull anything pushed since this job started, then push.
          git pull --rebase origin main
          git push origin HEAD:main

      # GitHub starts scheduled jobs hours late, so this step only PREPARES the email; Brevo then
      # delivers it at an exact time (03:00 UTC = 08:30 IST by default). A manual run with the box
      # ticked sends immediately. Does nothing until the Brevo settings exist (see EMAIL-SETUP.md).
      - name: Send the daily email digest
        if: ${{ !cancelled() && (github.event.schedule == '17 18 * * *' || inputs.send_digest) }}
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: ${{ secrets.BREVO_LIST_ID }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          BREVO_SENDER_NAME: ${{ secrets.BREVO_SENDER_NAME }}
          SITE_URL: ${{ secrets.SITE_URL }}
          DIGEST_SEND_AT_UTC: ${{ vars.DIGEST_SEND_AT_UTC }}
        run: python scripts/update_news.py index.html --digest ${{ github.event_name == 'workflow_dispatch' && '--now' || '' }}
