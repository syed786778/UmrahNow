name: Update news and advisories

on:
  schedule:
    - cron: "17 0,4,8,12,16,20 * * *"   # every 4 hours: refresh the page, then keep tomorrow's email in step with it
  workflow_dispatch:              # run it by hand from the Actions tab
    inputs:
      send_digest:
        description: "Also send the email digest to subscribers"
        type: boolean
        default: false
      schedule_for_morning:
        description: "...but schedule it for 08:30 IST tomorrow (the automatic path) instead of sending now"
        type: boolean
        default: false

permissions:
  contents: write                 # lets the job commit the refreshed page

# One run at a time, so two runs can never push over each other.
concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ONE script does everything: news cards + travel advisories.
      # If your page isn't called index.html, change the filename in the two python steps.
      - name: Refresh news cards and travel advisories
        run: python scripts/update_news.py index.html

      - name: Commit and push if changed
        if: ${{ !cancelled() }}
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name  "umrahnow-news-bot"
          git config user.email "umrahnow-news-bot@users.noreply.github.com"
          git add -A
          git commit -m "chore: refresh Umrah/Hajj news and travel advisories [automated]"
          # Pull anything pushed since this job started, then push.
          git pull --rebase origin main
          git push origin HEAD:main

      # GitHub starts scheduled jobs hours late, so this step never sends on its own clock. It creates
      # tomorrow's email in Brevo (which delivers it at 03:00 UTC = 08:30 IST by default) and, on every
      # later run, UPDATES that email if the advisories or news have changed, so the email matches the
      # site. A manual run with the box ticked sends immediately. Does nothing until the Brevo settings
      # exist (see EMAIL-SETUP.md).
      - name: Send the daily email digest
        if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.send_digest) }}
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: ${{ vars.BREVO_LIST_ID }}
          BREVO_SENDER_EMAIL: ${{ vars.BREVO_SENDER_EMAIL }}
          BREVO_SENDER_NAME: ${{ vars.BREVO_SENDER_NAME }}
          SITE_URL: ${{ vars.SITE_URL }}
          DIGEST_SEND_AT_UTC: ${{ vars.DIGEST_SEND_AT_UTC }}
        run: python scripts/update_news.py index.html --digest ${{ (github.event_name == 'workflow_dispatch' && !inputs.schedule_for_morning) && '--now' || '' }}
