name: Update news

on:
  schedule:
    - cron: "0 3 * * *"      # every day at 03:00 UTC (06:00 Makkah time)
  workflow_dispatch:          # also lets you run it manually from the Actions tab

permissions:
  contents: write             # needed so the job can commit the refreshed page

# Only one run at a time, so two runs can't push over each other.
concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # If your page isn't called index.html, change the filename below.
      - name: Refresh the news cards
        run: python scripts/update_news.py index.html

      - name: Commit and push if changed
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name  "umrahnow-news-bot"
          git config user.email "umrahnow-news-bot@users.noreply.github.com"
          git add -A
          git commit -m "chore: refresh Umrah/Hajj news [automated]"
          # Pull anything pushed since this job started, then push.
          git pull --rebase origin main
          git push origin HEAD:main
