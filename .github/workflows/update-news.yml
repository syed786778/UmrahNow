name: Update news and advisories

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours (at :17 past, to avoid GitHub's busy top-of-hour slots)
  workflow_dispatch:          # also lets you run it manually from the Actions tab

permissions:
  contents: write             # needed so the job can commit the refreshed page

# Only one run at a time, so two runs can't push over each other.
concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # If your page isn't called index.html, change the filename in both steps.
      - name: Refresh the news cards
        run: python scripts/update_news.py index.html

      # Runs even if the news step failed, so one broken source never blocks the other.
      - name: Refresh the travel advisories
        if: ${{ !cancelled() }}
        run: python scripts/update_advisories.py index.html

      - name: Commit and push if changed
        if: ${{ !cancelled() }}
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name  "umrahnow-news-bot"
          git config user.email "umrahnow-news-bot@users.noreply.github.com"
          git add -A
          git commit -m "chore: refresh Umrah/Hajj news and travel advisories [automated]"
          # Pull anything pushed since this job started, then push.
          git pull --rebase origin main
          git push origin HEAD:main
